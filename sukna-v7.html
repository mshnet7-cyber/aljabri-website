<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>سوقنا — Premium Simple First V7</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--ink:#15221a;--muted:#718078;--green:#138a52;--green2:#e7f6ee;--line:#e4ebe7;--red:#c53e3e;--red2:#fdeeee;--amber:#a16e12;--amber2:#fff5dc;--blue:#2c6fa6;--blue2:#edf6fc;--shadow:0 12px 30px rgba(24,45,34,.07);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif}
button,input,select{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#fff;border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:28px;color:var(--green);padding:7px 8px 2px}.tag{color:var(--muted);font-size:12px;padding:0 8px 15px}.tenant{border:1px solid var(--line);background:#fafcfa;border-radius:16px;padding:12px;margin-bottom:14px}.tenant .name{font-weight:800}.role{font-size:12px;color:var(--muted);margin-top:4px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;border-radius:12px;padding:11px 12px;text-align:right;cursor:pointer;color:var(--ink)}.nav button.active,.nav button:hover{background:var(--green2);color:var(--green);font-weight:800}.nav button{display:flex;align-items:center;gap:10px}.navIcon{width:30px;height:30px;border-radius:10px;background:#f3f7f4;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 30px}.nav button.active .navIcon,.nav button:hover .navIcon{background:#dff2e7}.mobileNav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.mobileNav .navIcon{width:auto;height:auto;background:transparent;border-radius:0;font-size:18px}.mobileNav button.active .navIcon{background:transparent}.mobileNav button span:last-child{font-size:10px}.sideBottom{position:absolute;bottom:18px;left:18px;right:18px}.support{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fbfcfb}.main{padding:20px 28px 86px;max-width:1520px;width:100%;margin:auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.search{flex:1;background:#fff;border:1px solid var(--line);padding:13px 15px;border-radius:14px}.topActions{display:flex;gap:8px}.icon{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
.rolePickerBtn{display:flex;align-items:center;gap:8px;font-weight:800;border-color:#cfe1d6;background:linear-gradient(180deg,#ffffff,#f5faf7);box-shadow:0 8px 22px rgba(24,45,34,.06)}
.rolePickerBtn .navIcon{width:28px;height:28px;border-radius:9px;background:#e7f6ee;color:var(--green);font-size:15px}
.roleGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.roleCard{position:relative;border:1px solid #e2ebe6;background:linear-gradient(180deg,#fff,#fbfdfc);border-radius:20px;padding:20px 16px;text-align:center;cursor:pointer;transition:.18s;box-shadow:0 10px 24px rgba(24,45,34,.06)}
.roleCard:hover{transform:translateY(-3px);border-color:#b8d8c4;box-shadow:0 16px 34px rgba(24,45,34,.11)}.roleCard.active{border:2px solid var(--green);background:linear-gradient(180deg,#f7fcf9,#eef8f2);box-shadow:0 16px 34px rgba(19,138,82,.12)}
.roleIcon{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(135deg,#edf8f1,#dff2e7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}.roleCard h3{margin:0;font-size:18px}.roleCard p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.roleCheck{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:900}.roleCard.active .roleCheck{display:flex}.modalHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:4px}.modalClose{border:1px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;cursor:pointer}.roleHint{margin-top:14px;background:#f5faf7;border:1px solid #deece3;border-radius:14px;padding:12px;font-size:12px;color:#466056;text-align:center}
@media(max-width:900px){.roleGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.roleGrid{grid-template-columns:1fr 1fr;gap:10px}.roleCard{padding:14px 10px}.roleIcon{width:54px;height:54px;font-size:28px;border-radius:16px}.roleCard h3{font-size:15px}}
.headerLine{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}.headerLine h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr);margin:16px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.action{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;cursor:pointer;text-align:right;transition:.15s}.action:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.action .big{font-size:30px;margin-bottom:7px}.action strong{display:block;font-size:16px}.muted{color:var(--muted)}.kpi .lbl{font-size:12px;color:var(--muted)}.kpi .val{font-size:24px;font-weight:900;margin-top:6px}.trend{font-size:12px;margin-top:4px}.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--amber)}.row2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:flex;flex-direction:column}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:11px;background:var(--green2);color:var(--green);white-space:nowrap}.badge.red{background:var(--red2);color:var(--red)}.badge.amber{background:var(--amber2);color:var(--amber)}.badge.blue{background:var(--blue2);color:var(--blue)}.primary{background:var(--green);color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 15px;cursor:pointer}.danger{background:#fff;color:var(--red);border:1px solid #f1cccc;border-radius:12px;padding:11px 15px;cursor:pointer}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sectionTitle h2{margin:0;font-size:18px}.tiny{font-size:11px;color:var(--muted)}.productGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.product{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.productPic{height:110px;background:linear-gradient(135deg,#eff8f2,#f9fbf9);display:flex;align-items:center;justify-content:center;font-size:54px}.productBody{padding:12px}.price{font-weight:900;font-size:18px}.productFoot{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:11px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.table th{color:var(--muted);font-size:12px}.progress{height:8px;background:#edf2ef;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0}.step{text-align:center;position:relative}.dot{width:28px;height:28px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e9efeb;color:var(--muted);font-size:11px;font-weight:900}.step.done .dot{background:var(--green);color:#fff}.step.active .dot{background:#dff3e8;color:var(--green);border:2px solid var(--green)}.step span{display:block;font-size:11px;color:var(--muted);margin-top:7px}.modal{position:fixed;inset:0;background:rgba(12,22,16,.42);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.hidden{display:none}.modalBox{background:#fff;width:min(820px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:20px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{padding:12px;border-radius:12px;background:var(--green2);color:var(--green)}.mobileNav{display:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}.productGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:14px 12px 90px}.top{flex-wrap:wrap}.search{order:2;flex-basis:100%}.headerLine{align-items:flex-start}.headerLine h1{font-size:24px}.productGrid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.mobileNav{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);padding:8px;z-index:10;gap:6px}.mobileNav button{flex:1;border:0;background:transparent;padding:9px 3px;border-radius:11px;font-size:11px}.mobileNav button.active{background:var(--green2);color:var(--green);font-weight:800}.kpis{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}}@media(max-width:460px){.kpis,.actions{grid-template-columns:1fr}.productGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">سوقنا</div><div class="tag">من المزرعة إلى مستهلكك</div>
  <div class="tenant"><div class="name" id="tenantName">شركة الأمل للجملة</div><div class="role" id="roleName">تاجر الجملة · تشغيل يومي</div></div>
  <div class="nav" id="nav"></div>
  <div class="sideBottom"><button class="rolePickerBtn icon" onclick="switchRole()">◎ <span>اختيار النشاط</span></button><div class="support" style="margin-top:10px"><strong>مساعدة</strong><div class="tiny">مساعد سوقنا جاهز</div></div></div>
</aside>
<main class="main">
  <div class="top"><input class="search" placeholder="ابحث عن منتج، عميل، مورد، فاتورة..." oninput="globalSearch(this.value)"/><div class="topActions"><button class="icon" onclick="assistant()">🤖</button><button class="icon">🔔</button></div></div>
  <div id="screen"></div>
</main>
<div class="mobileNav" id="mobileNav"></div>
</div>
<div class="modal hidden" id="modal"><div class="modalBox" id="modalContent"></div></div>
<script>
const roles={owner:{label:'المالك / الإدارة',sub:'رؤية وإدارة كاملة',tenant:'منصة سوقنا'},wholesaler:{label:'تاجر الجملة',sub:'شراء وبيع وإدارة المخزون',tenant:'شركة الأمل للجملة'},retailer:{label:'صاحب محل',sub:'بيع سريع + شراء + طلب بضاعة',tenant:'محل البركة'},farmer:{label:'المزارع',sub:'عرض المحصول واستقبال الطلبات',tenant:'مزرعة السهل'},consumer:{label:'المستهلك',sub:'تسوق وطلب وتوصيل',tenant:'حساب المشتري'}};
let role='wholesaler';
const nav={owner:[['home','الرئيسية'],['market','السوق'],['orders','الطلبات'],['accounts','الحسابات'],['reports','التقارير'],['more','المزيد']],wholesaler:[['home','الرئيسية'],['sell','بيع'],['buy','شراء'],['orders','الطلبات'],['inventory','المخزون'],['market','السوق'],['accounts','الحسابات'],['more','المزيد']],retailer:[['home','الرئيسية'],['sell','بيع'],['buy','شراء'],['orders','الطلبات'],['inventory','المخزون'],['market','السوق'],['accounts','الحسابات'],['more','المزيد']],farmer:[['home','الرئيسية'],['products','منتجاتي'],['orders','الطلبات'],['sales','مبيعاتي'],['accounts','مستحقاتي'],['more','المزيد']],consumer:[['home','الرئيسية'],['market','المتاجر'],['orders','طلباتي'],['accounts','حسابي'],['more','المزيد']]};
const screens={
home:{title:'اليوم',render(){if(role==='farmer')return farmerHome();if(role==='consumer')return consumerHome();const title=role==='owner'?'مركز المنصة':'ماذا تحتاج اليوم؟';return `<div class="headerLine"><div><h1>${title}</h1><div class="sub">واجهة بسيطة · وقوة كبيرة خلفها</div></div><button class="secondary" onclick="switchRole()">اختيار النشاط</button></div><div class="grid actions"><button class="action" onclick="go('sell')"><div class="big">🛒</div><strong>بيع</strong><div class="muted">بيع سريع وتحديث الحساب والمخزون</div></button><button class="action" onclick="go('buy')"><div class="big">🧾</div><strong>شراء</strong><div class="muted">صوّر الفاتورة أو أدخلها بسرعة</div></button><button class="action" onclick="go('orders')"><div class="big">🛍️</div><strong>اطلب بضاعة</strong><div class="muted">قارن العروض واطلب ما تحتاج</div></button><button class="action" onclick="go('inventory')"><div class="big">📦</div><strong>مخزوني</strong><div class="muted">المتاح والمحجوز والتالف</div></button></div><div class="grid kpis"><div class="card kpi"><div class="lbl">مبيعات اليوم</div><div class="val">4,850 ر.ع</div><div class="trend up">+12% عن أمس</div></div><div class="card kpi"><div class="lbl">مشتريات اليوم</div><div class="val">3,220 ر.ع</div><div class="trend">6 فواتير</div></div><div class="card kpi"><div class="lbl">لي عند العملاء</div><div class="val">7,420 ر.ع</div><div class="trend warn">4 مستحقات</div></div><div class="card kpi"><div class="lbl">عليّ للموردين</div><div class="val">5,180 ر.ع</div><div class="trend">2 استحقاق</div></div></div><div class="row2" style="margin-top:14px"><div class="card"><div class="sectionTitle"><h2>يحتاج انتباهك</h2><span class="tiny">الآن</span></div><div class="list"><div class="item"><span>3 طلبات جديدة</span><span class="badge">مراجعة</span></div><div class="item"><span>فاتورتان تحتاجان اعتماد</span><span class="badge amber">مراجعة</span></div><div class="item"><span>700 كغ خيار منخفض</span><span class="badge amber">مخزون</span></div><div class="item"><span>عميل متأخر 1,250 ر.ع</span><span class="badge red">تحصيل</span></div></div></div><div class="card"><div class="sectionTitle"><h2>آخر نشاط</h2><span class="tiny">مباشر</span></div><div class="list"><div class="item"><span>تم استلام دفعة</span><strong>420 ر.ع</strong></div><div class="item"><span>طلب #10482</span><span class="badge blue">قيد التجهيز</span></div><div class="item"><span>شراء خيار</span><strong>500 كغ</strong></div></div></div></div>`}},
sell:{title:'بيع',render(){if(role==='consumer')return consumerHome();return `<div class="headerLine"><div><h1>بيع سريع</h1><div class="sub">أدخل الوزن أو الكمية ثم أكمل الدفع</div></div></div><div class="card"><div class="field"><label>ابحث عن المنتج</label><input value="خيار"/></div><div class="two"><div class="field"><label>الوزن / الكمية</label><input value="2.500"/></div><div class="field"><label>الوحدة</label><select><option>كغ</option><option>صندوق</option><option>طن</option></select></div></div><div class="two"><div class="field"><label>السعر</label><input value="0.220"/></div><div class="field"><label>الدفع</label><select><option>نقدي</option><option>بطاقة</option><option>آجل</option><option>دفعة جزئية</option></select></div></div><div class="toast">الإجمالي: <strong>0.550 ر.ع</strong> · المخزون بعد البيع يتحدث تلقائيًا.</div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="completeSale()">إتمام البيع</button><button class="secondary" onclick="go('home')">إلغاء</button></div></div>`}},
buy:{title:'شراء',render(){return `<div class="headerLine"><div><h1>شراء</h1><div class="sub">اختر الطريقة الأسرع لك</div></div></div><div class="grid actions"><button class="action" onclick="scanInvoice()"><div class="big">📷</div><strong>صوّر فاتورة</strong><div class="muted">يقرأها الذكاء الاصطناعي ثم تراجعها</div></button><button class="action" onclick="manualBuy()"><div class="big">✍️</div><strong>إدخال سريع</strong><div class="muted">أدخل العملية يدويًا</div></button><button class="action" onclick="farmerBuy()"><div class="big">🌱</div><strong>شراء من مزارع</strong><div class="muted">سند شراء موثّق حتى لو بلا فاتورة</div></button><button class="action" onclick="showModal('<h2>شراء متكرر</h2><div class="toast">تم تجهيز سلة المشتريات المعتادة للمراجعة.</div><div style="margin-top:12px"><button class=\"primary\" onclick=\"closeModal()\">مراجعة السلة</button></div>')"><div class="big">🔁</div><strong>إعادة طلب</strong><div class="muted">استرجع مشترياتك المعتادة</div></button></div><div class="card"><div class="sectionTitle"><h2>آخر المشتريات</h2><span class="tiny">اليوم</span></div><div class="list"><div class="item"><span>شركة النور · 18 صنف</span><strong>1,842 ر.ع</strong></div><div class="item"><span>مزارع السهل · طماطم 500 كغ</span><span class="badge">موثقة</span></div><div class="item"><span>مورد خارجي · بطاطا 1 طن</span><strong>290 ر.ع</strong></div></div></div>`}},
orders:{title:'الطلبات',render(){return role==='consumer'?consumerOrders():`<div class="headerLine"><div><h1>طلباتك</h1><div class="sub">تتابع الطلب من القبول حتى الاستلام</div></div><button class="primary" onclick="newOrder()">+ طلب بضاعة</button></div><div class="card"><div class="sectionTitle"><h2>نشطة الآن</h2><span class="tiny">3 طلبات</span></div><div class="list"><div class="item"><div><strong>#10482 · خيار 1 طن</strong><div class="sub">محل البركة · توصيل إلى المحل</div></div><span class="badge blue">قيد التجهيز</span></div><div class="item"><div><strong>#10479 · طماطم 500 كغ</strong><div class="sub">تاجر A · اليوم 11:00</div></div><span class="badge">جاهز</span></div><div class="item"><div><strong>#10470 · بطاطا 700 كغ</strong><div class="sub">تاجر B · غدًا</div></div><span class="badge amber">قيد القبول</span></div></div></div>`}},
inventory:{title:'المخزون',render(){return `<div class="headerLine"><div><h1>مخزوني</h1><div class="sub">المتاح للبيع مرتبط بالمخزون الحقيقي</div></div><button class="secondary" onclick="showModal('<h2>جرد سريع</h2><div class=\"toast\">يمكنك إدخال الكميات الفعلية بسرعة ثم اعتماد الفروقات.</div><div style=\"margin-top:12px\"><button class=\"primary\" onclick=\"closeModal()\">بدء الجرد</button></div>')">جرد سريع</button></div><div class="card">${inventoryRows()}</div>`}},
market:{title:'السوق',render(){return `<div class="headerLine"><div><h1>ماذا تريد؟</h1><div class="sub">ابحث عن أفضل صفقة فعلية، وليس السعر فقط</div></div><button class="secondary" onclick="assistant()">بحث بالصوت</button></div><div class="card"><div class="field"><input value="خيار 1 طن"/></div><div class="split"><button class="secondary">الأرخص</button><button class="primary">أفضل قيمة</button></div></div><div class="card" style="margin-top:14px"><div class="sectionTitle"><h2>أفضل العروض</h2><span class="tiny">السعر + التوصيل + الوصول</span></div><table class="table"><thead><tr><th>البائع</th><th>السعر</th><th>التوصيل</th><th>الإجمالي</th><th>الوصول</th><th></th></tr></thead><tbody><tr><td>تاجر A</td><td>0.220</td><td>5</td><td>225 ر.ع</td><td>اليوم</td><td><button class="primary" onclick="placeOrder('تاجر A')">اطلب</button></td></tr><tr><td>تاجر B</td><td>0.215</td><td>14</td><td>229 ر.ع</td><td>اليوم</td><td><button class="secondary" onclick="placeOrder('تاجر B')">اطلب</button></td></tr><tr><td>مزرعة السهل</td><td>0.182</td><td>0</td><td>182 ر.ع</td><td>غدًا</td><td><button class="secondary" onclick="placeOrder('مزرعة السهل')">اطلب</button></td></tr></tbody></table></div><div class="card" style="margin-top:14px"><div class="sectionTitle"><h2>منتجات مقترحة</h2><button class="secondary" onclick="go('market')">عرض الكل</button></div>${products(true)}</div>`}},
accounts:{title:'الحسابات',render(){return `<div class="headerLine"><div><h1>حسابك</h1><div class="sub">الأرقام العملية أولًا والتفاصيل عند الحاجة</div></div></div><div class="grid kpis"><div class="card kpi"><div class="lbl">لك عند العملاء</div><div class="val">7,420 ر.ع</div></div><div class="card kpi"><div class="lbl">عليك للموردين</div><div class="val">5,180 ر.ع</div></div><div class="card kpi"><div class="lbl">المبيعات</div><div class="val">84,650 ر.ع</div></div><div class="card kpi"><div class="lbl">المصاريف</div><div class="val">8,300 ر.ع</div></div></div><div class="card" style="margin-top:14px"><div class="sectionTitle"><h2>آخر الحسابات</h2><button class="secondary" onclick="showModal('<h2>كشف الحساب</h2><div class=\"toast\">يمكنك اختيار العميل أو المورد ثم مشاركة كشف الحساب عبر WhatsApp.</div>')">كشف حساب</button></div><div class="list"><div class="item"><span>محل البركة</span><strong>1,250 ر.ع</strong></div><div class="item"><span>شركة النور</span><strong>-850 ر.ع</strong></div><div class="item"><span>مزرعة السهل</span><strong>90 ر.ع</strong></div></div></div>`}},
more:{title:'المزيد',render(){return `<div class="headerLine"><div><h1>المزيد</h1><div class="sub">كل الأدوات المتقدمة موجودة هنا عند الحاجة</div></div></div><div class="grid actions"><button class="action" onclick="showModal('<h2>المصاريف</h2><p class=\"muted\">إضافة مصروف بسرعة مع إمكانية إرفاق صورة.</p><div style=\"margin-top:12px\"><button class=\"primary\" onclick=\"closeModal()\">إضافة مصروف</button></div>')"><div class="big">💸</div><strong>مصاريف</strong></button><button class="action" onclick="showModal('<h2>الفواتير</h2><p class=\"muted\">البحث عن الفواتير والمستندات ومشاركتها.</p>')"><div class="big">🧾</div><strong>الفواتير</strong></button><button class="action" onclick="showModal('<h2>التوصيل</h2><p class=\"muted\">طلبات في الطريق وإثبات التسليم.</p>')"><div class="big">🚚</div><strong>التوصيل</strong></button><button class="action" onclick="showModal('<h2>التقارير</h2><p class=\"muted\">المبيعات، المشتريات، المخزون، الربحية والضرائب.</p>')"><div class="big">📊</div><strong>التقارير</strong></button></div>`}},
products:{title:'منتجاتي',render(){return `<div class="headerLine"><div><h1>منتجاتي</h1><div class="sub">أضف محصولك في ثوانٍ</div></div><button class="primary" onclick="showModal('<h2>أضف محصولًا</h2><div class=\"field\"><label>اسم المحصول</label><input value=\"طماطم\"/></div><div class=\"field\"><label>الكمية</label><input value=\"3\"/></div><div class=\"field\"><label>الوحدة</label><select><option>طن</option><option>كغ</option></select></div><div class=\"field\"><label>السعر</label><input value=\"تفاوض\"/></div><button class=\"primary\" onclick=\"closeModal()\">نشر</button>')">+ أضف محصول</button></div><div class="card">${products(false)}</div>`}},
sales:{title:'مبيعاتي',render(){return `<div class="headerLine"><div><h1>مبيعاتي</h1><div class="sub">ملخص بسيط للمبيعات والمستحقات</div></div></div><div class="grid kpis"><div class="card kpi"><div class="lbl">مبيعات هذا الشهر</div><div class="val">3,240 ر.ع</div></div><div class="card kpi"><div class="lbl">المستحق</div><div class="val">640 ر.ع</div></div></div><div class="card" style="margin-top:14px"><div class="list"><div class="item"><span>طلب #10482</span><strong>90 ر.ع</strong></div><div class="item"><span>طلب #10476</span><strong>220 ر.ع</strong></div></div></div>`}}
};
function farmerHome(){return `<div class="headerLine"><div><h1>محصولي اليوم</h1><div class="sub">كل ما تحتاجه لإتمام البيع</div></div></div><div class="grid actions"><button class="action" onclick="go('products')"><div class="big">🌱</div><strong>أضف محصولًا</strong></button><button class="action" onclick="go('orders')"><div class="big">📦</div><strong>الطلبات</strong></button><button class="action" onclick="go('sales')"><div class="big">💰</div><strong>مبيعاتي</strong></button><button class="action" onclick="go('accounts')"><div class="big">💳</div><strong>مستحقاتي</strong></button></div><div class="card"><div class="sectionTitle"><h2>المتوفر الآن</h2><span class="tiny">3 منتجات</span></div>${products(true)}</div>`}
function consumerHome(){return `<div class="headerLine"><div><h1>ابدأ التسوق</h1><div class="sub">اختر متجرًا واطلب ما تحتاجه</div></div></div><div class="card"><div class="field"><label>ماذا تريد؟</label><input value="خيار"/></div><button class="primary" onclick="go('market')">ابحث</button></div><div class="card" style="margin-top:14px"><div class="sectionTitle"><h2>متاجر مقترحة</h2></div>${products(true)}</div>`}
function consumerOrders(){return `<div class="headerLine"><div><h1>طلباتي</h1><div class="sub">تتبع التوصيل حتى الاستلام</div></div></div><div class="card"><div class="list"><div class="item"><span>متجر البركة · طلب #2205</span><span class="badge blue">في الطريق</span></div><div class="item"><span>متجر الندى · طلب #2198</span><span class="badge">تم التسليم</span></div></div></div>`}
function productsBlock(){return `<div class="productGrid">${products(false)}</div>`}
function products(compact){return [['🍅','طماطم','0.450 ر.ع/kg'],['🥒','خيار','0.220 ر.ع/kg'],['🥔','بطاطا','0.290 ر.ع/kg'],['🧅','بصل','0.180 ر.ع/kg']].map(p=>`<div class="product"><div class="productPic">${p[0]}</div><div class="productBody"><strong>${p[1]}</strong><div class="subtle">${compact?'متاح للبيع الآن':'متوفر'}</div><div class="productFoot"><span class="price">${p[2]}</span><span class="pill">+ إضافة</span></div></div></div>`).join('')}
function inventoryRows(){return `<div class="sectionTitle"><h2>حالة المخزون</h2><span class="tiny">آخر تحديث الآن</span></div><table class="table"><thead><tr><th>الصنف</th><th>فعلي</th><th>محجوز</th><th>متاح</th><th>الحالة</th></tr></thead><tbody><tr><td>خيار</td><td>1,820 كغ</td><td>500 كغ</td><td>1,320 كغ</td><td><span class="badge amber">منخفض</span></td></tr><tr><td>طماطم</td><td>2,400 كغ</td><td>300 كغ</td><td>2,100 كغ</td><td><span class="badge">جيد</span></td></tr><tr><td>بطاطا</td><td>3,100 كغ</td><td>800 كغ</td><td>2,300 كغ</td><td><span class="badge">جيد</span></td></tr><tr><td>بصل</td><td>980 كغ</td><td>0</td><td>980 كغ</td><td><span class="badge">جيد</span></td></tr></tbody></table>`}
function buildNav(){const items=nav[role];const icons={home:'⌂',sell:'🛒',buy:'🧾',orders:'📦',inventory:'▦',market:'🔎',accounts:'💳',reports:'▥',more:'•••',products:'🌱',sales:'💰'};document.getElementById('nav').innerHTML=items.map(x=>`<button id="n-${x[0]}" onclick="go('${x[0]}')"><span class="navIcon">${icons[x[0]]||'•'}</span><span>${x[1]}</span></button>`).join('');document.getElementById('mobileNav').innerHTML=items.slice(0,5).map(x=>`<button id="m-${x[0]}" onclick="go('${x[0]}')"><span class="navIcon">${icons[x[0]]||'•'}</span><span>${x[1]}</span></button>`).join('');document.getElementById('tenantName').textContent=roles[role].tenant;document.getElementById('roleName').textContent=roles[role].label+' · '+roles[role].sub}
function go(k){const s=screens[k]||screens.home;document.getElementById('screen').innerHTML=s.render();(nav[role]||[]).forEach(x=>{document.getElementById('n-'+x[0])?.classList.toggle('active',x[0]===k);document.getElementById('m-'+x[0])?.classList.toggle('active',x[0]===k)});window.scrollTo({top:0,behavior:'smooth'})}
function switchRole(){const cards=[['owner','👑','المالك / الإدارة','رؤية وإدارة كاملة'],['wholesaler','📦','تاجر الجملة','شراء وبيع وإدارة المخزون'],['retailer','🏪','صاحب محل','بيع سريع + شراء + طلب بضاعة'],['farmer','🌱','المزارع','عرض المحصول واستقبال الطلبات'],['consumer','🛒','المستهلك','تسوق وطلب وتوصيل']];showModal(`<div class="modalHead"><div><h2 style="margin:0">كيف تريد استخدام سوقنا؟</h2><div class="sub">اختر المكان الذي تعمل أو تتسوق منه الآن</div></div><button class="modalClose" onclick="closeModal()">✕</button></div><div class="roleGrid">${cards.map(c=>`<button class="roleCard ${role===c[0]?'active':''}" onclick="selectRole('${c[0]}')"><span class="roleCheck">✓</span><div class="roleIcon">${c[1]}</div><h3>${c[2]}</h3><p>${c[3]}</p></button>`).join('')}</div><div class="roleHint">يمكنك فتح أكثر من نشاط من نفس الحساب. هذا الاختيار يحدد الواجهة التي تراها الآن.</div>`) }
function selectRole(next){role=next;closeModal();buildNav();go('home');toast('تم فتح: '+roles[role].label)}
function globalSearch(v){if(v.trim().length>1)toast('بحث تجريبي: '+v)}
function showModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function toast(msg){showModal(`<div class="toast"><strong>${msg}</strong></div><div style="display:flex;justify-content:flex-start;margin-top:12px"><button class="primary" onclick="closeModal()">تم</button></div>`)}
function scanInvoice(){showModal(`<h2>قراءة فاتورة المورد</h2><div class="sub">محاكاة AI OCR — الصورة الأصلية تحفظ ويمكن مراجعة كل بند</div><div class="card" style="margin-top:12px"><div class="item"><span>المورد</span><strong>شركة النور</strong></div><div class="item"><span>عدد البنود</span><strong>18</strong></div><div class="item"><span>الإجمالي</span><strong>1,842 ر.ع</strong></div><div class="item"><span>ثقة الاستخراج</span><strong>98%</strong></div><div class="item"><span>تنبيه</span><span class="badge amber">2 أصناف غير معروفة</span></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="closeModal();toast('تم اعتماد الفاتورة بعد المراجعة')">اعتماد بعد المراجعة</button><button class="secondary" onclick="closeModal()">لاحقًا</button></div>`)}
function manualBuy(){showModal(`<h2>إدخال شراء سريع</h2><div class="two"><div class="field"><label>المورد</label><input value="مورد خارجي"/></div><div class="field"><label>الصنف</label><input value="خيار"/></div></div><div class="two"><div class="field"><label>الكمية</label><input value="500"/></div><div class="field"><label>الوحدة</label><select><option>كغ</option><option>صندوق</option><option>طن</option></select></div></div><div class="field"><label>السعر</label><input value="0.190"/></div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="closeModal();toast('تم حفظ الشراء وتحديث المخزون والحسابات')">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function farmerBuy(){showModal(`<h2>شراء مباشر من مزارع</h2><div class="sub">سند شراء موثّق — ليس Tax Invoice</div><div class="two"><div class="field"><label>المزرعة</label><input value="أحمد سالم"/></div><div class="field"><label>الهاتف</label><input value="+968 9XXXXXXX"/></div></div><div class="two"><div class="field"><label>الصنف</label><input value="طماطم"/></div><div class="field"><label>الكمية</label><input value="500"/></div></div><div class="two"><div class="field"><label>الوحدة</label><select><option>كغ</option><option>صندوق</option><option>طن</option><option>حمولة</option></select></div><div class="field"><label>السعر</label><input value="0.180"/></div></div><div class="field"><label>طريقة الدفع</label><select><option>نقدي</option><option>تحويل</option><option>آجل</option></select></div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="closeModal();farmerConfirm()">تسجيل وإرسال تأكيد</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function farmerConfirm(){showModal(`<h2>تم تسجيل سند الشراء</h2><div class="toast">دخلت الكمية إلى المخزون، وسيرسل للمزارع تأكيد عبر القناة المتاحة.</div><div class="card" style="margin-top:12px"><div class="item"><span>الحالة</span><span class="badge amber">بانتظار تأكيد المزرعة</span></div><div class="item"><span>المزرعة</span><strong>أحمد سالم</strong></div><div class="item"><span>الكمية</span><strong>500 كغ طماطم</strong></div><div class="item"><span>الإجمالي</span><strong>90 ر.ع</strong></div></div><div style="display:flex;justify-content:flex-start;margin-top:12px"><button class="primary" onclick="closeModal()">إغلاق</button></div>`)}
function completeSale(){showModal(`<h2>تم تسجيل البيع</h2><div class="toast">تم تحديث المخزون والحسابات وتجهيز المستند المناسب.</div><div class="card" style="margin-top:12px"><div class="item"><span>رقم العملية</span><strong>TX-2026-00125</strong></div><div class="item"><span>الكمية</span><strong>2.500 كغ</strong></div><div class="item"><span>الإجمالي</span><strong>0.550 ر.ع</strong></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="primary" onclick="closeModal()">إغلاق</button><button class="secondary" onclick="closeModal();toast('تم تجهيز الفاتورة للمشاركة عبر WhatsApp')">WhatsApp</button></div>`)}
function assistant(){showModal(`<h2>مساعد سوقنا</h2><div class="sub">اكتب أو تحدث. المساعد يقترح ولا يعتمد العمليات المالية الحساسة وحده.</div><div class="field"><label>مثال</label><input value="أريد 1 طن خيار اليوم إلى محلي"/></div><div class="card"><div class="item"><span>أفضل قيمة</span><strong>تاجر A — 225 ر.ع</strong></div><div class="item"><span>الأسرع</span><strong>تاجر B — اليوم</strong></div><div class="item"><span>الأرخص</span><strong>مزرعة السهل — 182 ر.ع</strong></div></div><div style="display:flex;justify-content:flex-start;margin-top:12px"><button class="primary" onclick="closeModal();go('market')">عرض الخيارات</button></div>`)}
function placeOrder(seller){showModal(`<h2>تأكيد الطلب</h2><div class="item"><span>البائع</span><strong>${seller}</strong></div><div class="item"><span>الصنف</span><strong>خيار — 1 طن</strong></div><div class="item"><span>عنوان التسليم</span><strong>محل البركة · صحار</strong></div><div class="item"><span>الدفع</span><strong>حسب أهلية العميل</strong></div><div class="item"><span>السعر</span><strong>يُثبت داخل الطلب عند التأكيد</strong></div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="closeModal();toast('تم إرسال الطلب وتسجيله')">تأكيد</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function orderDetails(status){showModal(`<h2>الطلب #10482</h2><div class="item"><span>الحالة</span><span class="badge blue">${status}</span></div><div class="item"><span>الموقع</span><strong>موقع المحل محفوظ</strong></div><div class="timeline"><div class="step done"><div class="dot">✓</div><span>طلب</span></div><div class="step done"><div class="dot">✓</div><span>قبول</span></div><div class="step active"><div class="dot">3</div><span>تجهيز</span></div><div class="step"><div class="dot">4</div><span>توصيل</span></div><div class="step"><div class="dot">5</div><span>استلام</span></div></div><div style="display:flex;justify-content:flex-start"><button class="primary" onclick="closeModal()">إغلاق</button></div>`)}
function newOrder(){go('market')}
buildNav();go('home');
</script>
</body></html>
